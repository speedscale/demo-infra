receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 80
  filter/banking:
    error_mode: propagate
    traces:
      span:
        - 'resource.attributes["service.namespace"] != "banking-app"'
    logs:
      log_record:
        - 'log.body["namespace"] != "banking-app"'
        - 'log.body["msgType"] != "rrpair"'
        - 'log.body["l7protocol"] != "http"'
        - 'IsMatch(log.body["http"]["req"]["uri"], "(?i)/api/users/(login|register|refresh|reset|password)")'
  resource/partner:
    attributes:
      - {key: deployment.environment, value: partner-demo, action: upsert}
      - {key: deployment.environment.name, value: partner-demo, action: upsert}
  transform/capture:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], log.body["service"])
          - set(resource.attributes["service.name"], "transactions-service") where log.body["service"] == "banking-transactions"
          - set(resource.attributes["service.name"], "accounts-service") where log.body["service"] == "banking-accounts"
          - set(resource.attributes["service.name"], "user-service") where log.body["service"] == "banking-user"
          - set(resource.attributes["service.name"], "api-gateway") where log.body["service"] == "banking-gateway"
          - set(resource.attributes["service.name"], "frontend") where log.body["service"] == "banking-frontend"
          - set(resource.attributes["service.name"], "fraud-service") where log.body["service"] == "banking-fraud"
          - set(resource.attributes["service.name"], "notification-service") where log.body["service"] == "banking-notification"
          - set(resource.attributes["service.name"], "ai-service") where log.body["service"] == "banking-ai"
          - set(log.attributes["speedscale.workload"], log.body["service"])
          - set(log.attributes["speedscale.direction"], log.body["direction"])
          - set(log.cache["parent"], log.body["http"]["req"]["headers"]["Traceparent"][0]) where log.body["http"]["req"]["headers"]["Traceparent"] != nil
          - set(log.cache["parent"], log.body["http"]["req"]["headers"]["traceparent"][0]) where log.body["http"]["req"]["headers"]["traceparent"] != nil
          - set(log.cache["context"], ExtractPatterns(log.cache["parent"], "^00-(?P<trace>[0-9a-f]{32})-(?P<span>[0-9a-f]{16})-[0-9a-f]{2}$")) where log.cache["parent"] != nil
          - set(log.trace_id, TraceID(log.cache["context"]["trace"])) where log.cache["context"]["trace"] != nil
          # An incoming traceparent identifies the caller, not this service's server span.
          - set(log.span_id, SpanID(log.cache["context"]["span"])) where log.cache["context"]["span"] != nil and log.body["direction"] == "OUT"
  transform/session-headers:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - delete_matching_keys(log.body["http"]["req"]["headers"], "(?i)^(authorization|proxy-authorization|cookie|set-cookie|x-api-key)$")
          - delete_matching_keys(log.body["http"]["res"]["headers"], "(?i)^(authorization|proxy-authorization|cookie|set-cookie|x-api-key)$")
  batch:
    timeout: 1s
    send_batch_size: 100
exporters:
  datadog:
    api:
      key: ${env:DATADOG_PARTNER_API_KEY}
      site: ${env:DATADOG_PARTNER_SITE}
    hostname: microsvc-partner-demo
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/banking, resource/partner, batch]
      exporters: [datadog]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/banking, transform/capture, transform/session-headers, resource/partner, batch]
      exporters: [datadog]
