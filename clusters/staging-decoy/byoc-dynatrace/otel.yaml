receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 80
  filter/banking:
    error_mode: propagate
    traces:
      span:
        - resource.attributes["service.namespace"] != nil and resource.attributes["service.namespace"] != "banking-app"
        - resource.attributes["service.name"] == nil or not IsMatch(resource.attributes["service.name"], "^(api-gateway|accounts-service|transactions-service|user-service|frontend|fraud-service|notification-service|ai-service)$")
    logs:
      log_record:
        - log.body["namespace"] != "banking-app"
        - log.body["msgType"] != "rrpair"
        - log.body["http"] != nil and log.body["http"]["req"]["uri"] != nil and IsMatch(log.body["http"]["req"]["uri"], "(?i)/api/users/(login|register|refresh|reset|password)")
    metrics:
      metric:
        - resource.attributes["service.namespace"] != nil and resource.attributes["service.namespace"] != "banking-app"
        - resource.attributes["service.name"] == nil or not IsMatch(resource.attributes["service.name"], "^(api-gateway|accounts-service|transactions-service|user-service|frontend|fraud-service|notification-service|ai-service)$")
  resource/partner:
    attributes:
      - key: deployment.environment
        value: partner-demo
        action: upsert
      - key: deployment.environment.name
        value: partner-demo
        action: upsert
      - key: deployment.cluster
        value: staging-decoy
        action: upsert
      - key: service.namespace
        value: banking-app
        action: insert
  transform/errors:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - set(span.status.code, STATUS_CODE_ERROR) where span.attributes["http.status_code"] != nil and span.attributes["http.status_code"] >= 500
          - set(span.status.code, STATUS_CODE_ERROR) where span.attributes["http.response.status_code"] != nil and span.attributes["http.response.status_code"] >= 500
      - context: spanevent
        statements:
          - set(span.status.code, STATUS_CODE_ERROR) where spanevent.name == "exception"
          - set(span.attributes["error.type"], spanevent.attributes["exception.type"]) where spanevent.name == "exception" and spanevent.attributes["exception.type"] != nil
          - set(span.attributes["error.message"], spanevent.attributes["exception.message"]) where spanevent.name == "exception" and spanevent.attributes["exception.message"] != nil
          - set(span.attributes["error.stack"], spanevent.attributes["exception.stacktrace"]) where spanevent.name == "exception" and spanevent.attributes["exception.stacktrace"] != nil
  transform/capture:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], log.body["service"])
          - set(resource.attributes["service.name"], "transactions-service") where log.body["service"] == "banking-transactions"
          - set(resource.attributes["service.name"], "accounts-service") where log.body["service"] == "banking-accounts"
          - set(resource.attributes["service.name"], "user-service") where log.body["service"] == "banking-user"
          - set(resource.attributes["service.name"], "api-gateway") where log.body["service"] == "banking-gateway"
          - set(resource.attributes["service.name"], "frontend") where log.body["service"] == "banking-frontend"
          - set(resource.attributes["service.name"], "fraud-service") where log.body["service"] == "banking-fraud"
          - set(resource.attributes["service.name"], "notification-service") where log.body["service"] == "banking-notification"
          - set(resource.attributes["service.name"], "ai-service") where log.body["service"] == "banking-ai"
          - set(log.attributes["speedscale.workload"], log.body["service"])
          - set(log.attributes["speedscale.direction"], log.body["direction"])
          - set(log.attributes["speedscale.protocol"], log.body["l7protocol"])
          - set(log.attributes["speedscale.command"], log.body["command"])
          - set(log.attributes["speedscale.status"], log.body["status"])
          - set(log.attributes["network.peer.address"], log.body["network_address"])
          - set(log.attributes["http.request.method"], log.body["http"]["req"]["method"]) where log.body["http"] != nil
          - set(log.attributes["url.path"], log.body["http"]["req"]["uri"]) where log.body["http"] != nil
          - set(log.attributes["http.response.status_code"], log.body["http"]["res"]["statusCode"]) where log.body["http"] != nil
          - set(log.cache["parent"], log.body["http"]["req"]["headers"]["Traceparent"][0]) where log.body["http"] != nil and log.body["http"]["req"]["headers"]["Traceparent"] != nil
          - set(log.cache["parent"], log.body["http"]["req"]["headers"]["traceparent"][0]) where log.body["http"] != nil and log.body["http"]["req"]["headers"]["traceparent"] != nil
          - set(log.cache["context"], ExtractPatterns(log.cache["parent"], "^00-(?P<trace>[0-9a-f]{32})-(?P<span>[0-9a-f]{16})-[0-9a-f]{2}$")) where log.cache["parent"] != nil
          - set(log.trace_id, TraceID(log.cache["context"]["trace"])) where log.cache["context"]["trace"] != nil
          - set(log.span_id, SpanID(log.cache["context"]["span"])) where log.cache["context"]["span"] != nil and log.body["direction"] == "OUT"
          - set(log.span_id, SpanID(0x0000000000000000)) where log.body["direction"] == "IN"
          - set(log.body, Concat([log.body["direction"], log.body["l7protocol"]], " "))
          - set(log.body, Concat([log.body["direction"], log.body["l7protocol"], log.body["command"]], " ")) where log.body["command"] != nil
          - set(log.body, Concat([log.attributes["speedscale.direction"], log.attributes["http.request.method"], log.attributes["url.path"]], " ")) where log.attributes["http.request.method"] != nil
  filter/valid-service:
    error_mode: propagate
    logs:
      log_record:
        - resource.attributes["service.name"] == nil
        - resource.attributes["service.name"] == ""
        - not IsMatch(resource.attributes["service.name"], "^[A-Za-z0-9][A-Za-z0-9._-]*$")
  batch:
    timeout: 1s
    send_batch_size: 100
    send_batch_max_size: 200

exporters:
  otlphttp/dynatrace:
    endpoint: ${env:DT_OTLP_ENDPOINT}
    headers:
      Authorization: Api-Token ${env:DT_INGEST_TOKEN}
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/banking, resource/partner, transform/errors, batch]
      exporters: [otlphttp/dynatrace]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/banking, transform/capture, filter/valid-service, resource/partner, batch]
      exporters: [otlphttp/dynatrace]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/banking, resource/partner, batch]
      exporters: [otlphttp/dynatrace]
