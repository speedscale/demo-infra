receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/banking:
    error_mode: propagate
    traces:
      span:
        - resource.attributes["service.namespace"] != nil and resource.attributes["service.namespace"] != "banking-app"
        - resource.attributes["service.name"] == nil or not IsMatch(resource.attributes["service.name"], "^(api-gateway|accounts-service|transactions-service|user-service|frontend|fraud-service|notification-service|ai-service)$")
  resource/partner:
    attributes:
      - key: deployment.environment
        value: partner-demo
        action: upsert
      - key: deployment.environment.name
        value: partner-demo
        action: upsert
      - key: deployment.cluster
        value: staging-decoy
        action: upsert
  # RRPair log records carry full request/response bodies, so batches must stay far below Dynatrace's 10MiB OTLP payload cap.
  batch:
    send_batch_size: 100
    send_batch_max_size: 200
    timeout: 5s

exporters:
  # Direct tenant export avoids the lower payload limit on the in-cluster ActiveGate.
  otlphttp:
    endpoint: https://uim8926h.sprint.dynatracelabs.com/api/v2/otlp
    headers:
      Authorization: Api-Token ${env:DT_INGEST_TOKEN}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/banking, resource/partner, batch]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
