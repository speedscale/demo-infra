{
  "receivers": {
    "otlp/apps": {
      "protocols": {
        "grpc": {
          "endpoint": "0.0.0.0:4317"
        },
        "http": {
          "endpoint": "0.0.0.0:4318"
        }
      }
    },
    "otlp/captures": {
      "protocols": {
        "grpc": {
          "endpoint": "0.0.0.0:5317"
        },
        "http": {
          "endpoint": "0.0.0.0:5318"
        }
      }
    }
  },
  "processors": {
    "memory_limiter": {
      "check_interval": "1s",
      "limit_mib": 400,
      "spike_limit_mib": 80
    },
    "batch": {
      "timeout": "1s",
      "send_batch_size": 100
    }
  },
  "exporters": {
    "otlp/original": {
      "endpoint": "otel-collector.observability.svc.cluster.local:4317",
      "tls": {
        "insecure": true
      }
    },
    "nop/metrics": {},
    "nop/captures": {},
    "otlp/dynatrace": {
      "endpoint": "otel-collector.byoc-dynatrace.svc.cluster.local:4317",
      "tls": {
        "insecure": true
      }
    },
    "otlp/newrelic": {
      "endpoint": "otel-collector.byoc-newrelic.svc.cluster.local:4317",
      "tls": {
        "insecure": true
      }
    }
  },
  "extensions": {
    "health_check": {
      "endpoint": "0.0.0.0:13133"
    }
  },
  "service": {
    "extensions": [
      "health_check"
    ],
    "pipelines": {
      "traces": {
        "receivers": [
          "otlp/apps"
        ],
        "processors": [
          "memory_limiter",
          "batch"
        ],
        "exporters": [
          "otlp/original",
          "otlp/dynatrace",
          "otlp/newrelic"
        ]
      },
      "logs": {
        "receivers": [
          "otlp/apps"
        ],
        "processors": [
          "memory_limiter",
          "batch"
        ],
        "exporters": [
          "otlp/original"
        ]
      },
      "metrics": {
        "receivers": [
          "otlp/apps"
        ],
        "processors": [
          "memory_limiter",
          "batch"
        ],
        "exporters": [
          "nop/metrics",
          "otlp/dynatrace",
          "otlp/newrelic"
        ]
      },
      "logs/captures": {
        "receivers": [
          "otlp/captures"
        ],
        "processors": [
          "memory_limiter",
          "batch"
        ],
        "exporters": [
          "nop/captures",
          "otlp/dynatrace",
          "otlp/newrelic"
        ]
      }
    }
  }
}
