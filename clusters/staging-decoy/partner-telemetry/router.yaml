apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-trace-router
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: partner-trace-router
  template:
    metadata:
      labels:
        app: partner-trace-router
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.120.0@sha256:85ac41c2db88d0df9bd6145e608a3cb023f5d8443868adbfbbf66efb51087917
        args: ["--config=/etc/otel/otel.yaml"]
        ports:
        - name: grpc
          containerPort: 4317
        - name: http
          containerPort: 4318
        - name: health
          containerPort: 13133
        readinessProbe:
          httpGet:
            path: /
            port: health
        livenessProbe:
          httpGet:
            path: /
            port: health
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/otel
      volumes:
      - name: config
        configMap:
          name: partner-trace-router-config
---
apiVersion: v1
kind: Service
metadata:
  name: partner-trace-router
  namespace: observability
spec:
  selector:
    app: partner-trace-router
  ports:
  - name: grpc
    port: 4317
    targetPort: grpc
  - name: http
    port: 4318
    targetPort: http
