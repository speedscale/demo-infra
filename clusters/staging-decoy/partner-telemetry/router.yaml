apiVersion: v1
kind: ConfigMap
metadata:
  name: partner-trace-router
  namespace: observability
data:
  otel.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 80
      batch:
        timeout: 1s
        send_batch_size: 100

    exporters:
      otlp/original:
        endpoint: otel-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlp/datadog:
        endpoint: datadog-partner.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlp/dynatrace:
        endpoint: otel-collector.byoc-dynatrace.svc.cluster.local:4317
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/original, otlp/datadog, otlp/dynatrace]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/original]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/original]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-trace-router
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: partner-trace-router
  template:
    metadata:
      labels:
        app: partner-trace-router
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.120.1
        args: ["--config=/etc/otel/otel.yaml"]
        ports:
        - name: grpc
          containerPort: 4317
        - name: http
          containerPort: 4318
        - name: health
          containerPort: 13133
        readinessProbe:
          httpGet:
            path: /
            port: health
        livenessProbe:
          httpGet:
            path: /
            port: health
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/otel
      volumes:
      - name: config
        configMap:
          name: partner-trace-router
---
apiVersion: v1
kind: Service
metadata:
  name: partner-trace-router
  namespace: observability
spec:
  selector:
    app: partner-trace-router
  ports:
  - name: grpc
    port: 4317
    targetPort: grpc
  - name: http
    port: 4318
    targetPort: http
