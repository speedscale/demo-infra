apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microsvc-staging-decoy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/speedscale/microsvc
    targetRevision: HEAD
    path: kubernetes/overlays/speedscale-sidecar
    # Demo fixture: arm the Replay Lab null-memo bug on banking-transactions
    # (microsvc TransactionService, flag demo.memo-bug.enabled, default OFF in the
    # app). This IaC patch flips it ON for the Replay Lab recording. Remove to disarm.
    kustomize:
      patches:
        - target:
            kind: ConfigMap
            name: banking-user-config
          patch: &grpc-otel-endpoint |-
            - op: replace
              path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://partner-trace-router.observability:4317
        - target:
            kind: ConfigMap
            name: banking-accounts-config
          patch: *grpc-otel-endpoint
        - target:
            kind: ConfigMap
            name: banking-transactions-config
          patch: *grpc-otel-endpoint
        - target:
            kind: ConfigMap
            name: banking-gateway-config
          patch: *grpc-otel-endpoint
        - target:
            kind: ConfigMap
            name: banking-sim-config
          patch: *grpc-otel-endpoint
        - target:
            kind: ConfigMap
            name: banking-frontend-config
          patch: |-
            - op: replace
              path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://partner-trace-router.observability:4318/v1/traces
        - target:
            kind: ConfigMap
            name: banking-ai-config
          patch: |-
            - op: replace
              path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://partner-trace-router.observability:4318
        - target:
            kind: Deployment
            name: banking-transactions
          patch: |-
            - op: add
              path: /spec/template/spec/containers/0/env/-
              value:
                name: DEMO_MEMO_BUG_ENABLED
                value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: banking-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
