apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: byoc-newrelic-staging-decoy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/speedscale/demo-infra
    targetRevision: main
    path: clusters/staging-decoy/byoc-newrelic
  destination:
    server: https://kubernetes.default.svc
    namespace: byoc-newrelic
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
