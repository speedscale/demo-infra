apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: byoc-newrelic
data:
  otel.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 80
      filter/banking:
        error_mode: propagate
        traces:
          span:
            - resource.attributes["service.namespace"] != nil and resource.attributes["service.namespace"] != "banking-app"
            - resource.attributes["service.name"] == nil or not IsMatch(resource.attributes["service.name"], "^(api-gateway|accounts-service|transactions-service|user-service|frontend|fraud-service|notification-service|ai-service)$")
        logs:
          log_record:
            - log.body["namespace"] != "banking-app"
            - log.body["msgType"] != "rrpair"
            - log.body["l7protocol"] != "http"
            - IsMatch(log.body["http"]["req"]["uri"], "(?i)/api/users/(login|register|refresh|reset|password)")
      resource/partner:
        attributes:
          - key: deployment.environment
            value: partner-demo
            action: upsert
          - key: deployment.environment.name
            value: partner-demo
            action: upsert
          - key: deployment.cluster
            value: staging-decoy
            action: upsert
      batch:
        send_batch_size: 100
        send_batch_max_size: 200
        timeout: 5s

    exporters:
      otlphttp:
        endpoint: https://otlp.nr-data.net
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/banking, resource/partner, batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, filter/banking, resource/partner, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: byoc-newrelic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
          args: ["--config=/etc/otel/otel.yaml"]
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: byoc-newrelic
                  key: license-key
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: byoc-newrelic
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
