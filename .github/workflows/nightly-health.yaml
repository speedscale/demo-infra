name: Nightly health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nightly-health.yaml'
      - 'quality/nightly-checks.json'
      - 'quality/scripts/check-nightlies.py'
      - 'quality/scripts/test-check-nightlies.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-health-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 quality/scripts/test-check-nightlies.py
  check:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.NIGHTLY_HEALTH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Load previous notification state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          artifact=$(gh api "repos/$REPO/actions/artifacts?name=nightly-health&per_page=100" | jq --arg branch "$DEFAULT_BRANCH" 'first(.artifacts[] | select(.expired == false and .workflow_run.head_branch == $branch and .workflow_run.head_repository_id == .workflow_run.repository_id)) | .workflow_run.id // empty')
          if [ -n "$artifact" ]; then
            gh run download "$artifact" --repo "$REPO" --name nightly-health --dir previous
          fi
      - name: Check schedules and notify changes
        env:
          NIGHTLY_GITLAB_TOKEN: ${{ secrets.NIGHTLY_GITLAB_TOKEN }}
          NIGHTLY_GITHUB_TOKEN: ${{ secrets.NIGHTLY_GITHUB_TOKEN }}
          NIGHTLY_SLACK_WEBHOOK: ${{ secrets.NIGHTLY_SLACK_WEBHOOK }}
        run: python3 quality/scripts/check-nightlies.py
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-health
          path: nightly-health.json
          retention-days: 90
          if-no-files-found: error
