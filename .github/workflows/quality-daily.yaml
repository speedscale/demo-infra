name: Daily Quality Replays

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster to replay (or "all")'
        default: 'all'
      cloud_load_only:
        description: 'Run only Speedscale Cloud load scenarios'
        type: boolean
        default: false

permissions:
  contents: read

# One group across ALL trigger types: schedule and workflow_dispatch runs replay
# against the same clusters and the same workloads, so two concurrent runs
# interleave TrafficReplays and hang each other (observed 2026-08-28: a stale
# scheduled run held staging while a dispatched run replayed the same SUTs).
# Newest run wins; the superseded run is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-scheduled-run:
    name: Validate scheduled run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.guard.outputs.should-run }}
    steps:
    - name: Check scheduled SHA
      id: guard
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        RUN_SHA: ${{ github.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "$EVENT_NAME" != "schedule" ]; then
          echo "should-run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        latest_sha="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
        if [ "$RUN_SHA" != "$latest_sha" ]; then
          echo "Scheduled run is stale: $RUN_SHA != $latest_sha"
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "should-run=true" >> "$GITHUB_OUTPUT"

  reset-mocks:
    name: Reset standing mocks
    runs-on: ubuntu-latest
    needs: validate-scheduled-run
    if: needs.validate-scheduled-run.outputs.should-run == 'true' && !inputs.cloud_load_only
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cluster: [dev-decoy, staging-decoy]
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    # The replay-banking-* responder-only TrafficReplays in banking-app are the
    # app's standing third-party mocks. Recreate them daily so the responder,
    # redis, and SUT reroute start from a clean provision instead of aging in
    # place. Skipped for a workflow_dispatch that targets the other cluster.
    - name: Recreate responder-only mocks
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.cluster == 'all' || github.event.inputs.cluster == matrix.cluster
      run: ./quality/scripts/reset-standing-mocks.sh ${{ matrix.cluster }}

  ci-replay:
    name: CI replay (proxymock)
    runs-on: ubuntu-latest
    # Depend on reset-mocks for ordering only: the mocks live in banking-app and
    # their rollout competes for node capacity with the replays, but a failed
    # reset must not skip the gate.
    needs: [validate-scheduled-run, reset-mocks]
    if: >-
      !cancelled() && !inputs.cloud_load_only &&
      needs.validate-scheduled-run.outputs.should-run == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replay:
          - banking-accounts
          - banking-ai
          - banking-fraud
          - banking-gateway
          - banking-notification
          - banking-transactions
          - banking-user
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Install proxymock
      timeout-minutes: 5
      run: ./quality/scripts/install-latest-tool.sh proxymock

    - name: Configure speedctl for CI replay
      env:
        SPEEDCTL_DEV_CONFIG: ${{ secrets.SPEEDCTL_DEV_CONFIG }}
      run: |
        mkdir -p "$HOME/.speedscale"
        echo "$SPEEDCTL_DEV_CONFIG" > "$HOME/.speedscale/config.yaml"

    - name: Run proxymock scenario
      env:
        SPEEDCTL_HOME: ${{ runner.temp }}/speedctl
        SPEEDSCALE_HOME: ${{ runner.temp }}/speedctl
      run: |
        mkdir -p "$SPEEDCTL_HOME"
        cp "$HOME/.speedscale/config.yaml" "$SPEEDCTL_HOME/config.yaml"
        ./quality/scripts/run-proxymock-scenario.sh dev-decoy ${{ matrix.replay }}

    - name: Upload proxymock report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: proxymock-ci-${{ matrix.replay }}
        path: quality/proxymock-reports/dev-decoy/${{ matrix.replay }}.json
        if-no-files-found: ignore

  quality-dev:
    name: Dev cluster quality
    needs: [validate-scheduled-run, ci-replay]
    if: >-
      !cancelled() && needs.validate-scheduled-run.outputs.should-run == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.cluster == 'all' || inputs.cluster == 'dev-decoy')
    uses: ./.github/workflows/quality-cluster.yaml
    with:
      cluster: dev-decoy
      cloud_load_only: ${{ inputs.cloud_load_only || false }}
    secrets: inherit

  quality-staging:
    name: Staging cluster quality
    # CI sends traffic only to dev; staging has its own capacity and workloads.
    needs: [validate-scheduled-run, reset-mocks]
    if: >-
      !cancelled() && needs.validate-scheduled-run.outputs.should-run == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.cluster == 'all' || inputs.cluster == 'staging-decoy')
    uses: ./.github/workflows/quality-cluster.yaml
    with:
      cluster: staging-decoy
      cloud_load_only: ${{ inputs.cloud_load_only || false }}
    secrets: inherit
