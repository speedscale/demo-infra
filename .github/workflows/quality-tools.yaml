name: Quality Tool Installation

on:
  pull_request:
    paths:
      - '.github/workflows/quality-*.yaml'
      - 'quality/scripts/install-latest-tool.sh'
      - 'quality/tests/test_tool_install.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test installation failure handling
        run: python3 -m unittest discover -s quality/tests -p test_tool_install.py
      - name: Install latest speedctl
        timeout-minutes: 5
        run: ./quality/scripts/install-latest-tool.sh speedctl
      - name: Install latest proxymock
        timeout-minutes: 5
        run: ./quality/scripts/install-latest-tool.sh proxymock
